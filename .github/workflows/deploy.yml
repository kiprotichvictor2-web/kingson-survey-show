name: Test Kingson Survey Show question bank

on:
  push:
    branches:
      - test/250-question-bank

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run automated tests
        run: bun run test
      - name: Build website
        run: bun run build
      - name: Check website output
        run: test -f .output/public/index.html
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    if: false
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "Deployment intentionally disabled for this test branch"
